[project]
name = "halfspace-optimizer"
version = "0.1.1"
authors = [
  { name="Joshua Ivanhoe", email="joshua.k.ivanhoe@gmail.com" },
]
description = "Cutting-plane solver for mixed-integer convex optimization problems"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
keywords = ["optimization", "mixed-integer", "convex", "cutting-plane", "solver"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "mip>=1.15.0,<2.0.0",
    "numpy>=2.3.3,<3.0.0",
    "pandas>=2.3.2,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/joshivanhoe/halfspace"
Issues = "https://github.com/joshivanhoe/halfspace/issues"

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "tomli",
]
test = [
    "pytest",
    "pytest-cov",
]
all = [
    "halfspace-optimizer[dev,test]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = []

[tool.hatch.build.targets.wheel]
packages = ["src/halfspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/halfspace",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src/halfspace"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
